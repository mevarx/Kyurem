# Kyurem gateway example configuration (M1–M7).
#
# Run without starting the server:
#   kyurem validate --config config/kyurem.example.yaml
#
# Every scalar option can be overridden from the environment, e.g.:
#   KYUREM_LISTENERS_A2A_ADDR=":8080"
# Security enforcement is opt-in for this local-demo profile. Enable caller
# authentication, trust verification, and policy before exposing the gateway.

listeners:
  # The A2A data path. Agents point their clients at this listener.
  a2a:
    addr: "127.0.0.1:8080"
    # URL used when rewriting agent cards so discovery loops back through the
    # gateway. If empty, the gateway derives it from the request Host header
    # (fine for local demos; set it explicitly behind a load balancer).
    public_base_url: ""
    # Path prefix under which agents are exposed: `{route_prefix}/{agent}`.
    route_prefix: "/a2a"

  # Health, readiness, metrics and version endpoints. Isolated from the data
  # path; management API endpoints are added here in M3.
  admin:
    addr: "127.0.0.1:8081"

  # The management API (M3) lives on its own listener: the A2A data path
  # stays transparent, the management API is authenticated and versioned.
  mgmt:
    addr: "127.0.0.1:8082"

logging:
  # debug | info | warn | error
  level: info
  # text | json (json is structured and trace-id aware; default json)
  format: json

# OpenTelemetry trace export (M2). W3C traceparent/tracestate propagation
# runs even when otlp_endpoint is empty; only export is disabled.
telemetry:
  service_name: kyurem-gateway
  # OTLP collector endpoint. Empty = export disabled.
  # http/protobuf accepts `host:port` or an http(s):// URL; grpc accepts
  # `host:port`. For a local collector (compose):
  #   otlp_endpoint: "http://127.0.0.1:4318"
  otlp_endpoint: ""
  otlp_protocol: http/protobuf
  # Only used for host:port endpoints; URL endpoints decide by scheme.
  otlp_insecure: true
  # Head-sampling probability for gateway-rooted traces. Inbound sampled
  # traces always keep the caller's decision.
  sample_ratio: 1
  # Bounded async export (TR-5): overload drops spans, never traffic.
  queue_size: 2048
  batch_size: 512
  batch_timeout: 5s
  export_timeout: 10s
  max_retries: 4
  initial_backoff: 500ms
  max_backoff: 10s
  # TR-4 is not implemented in M2; true fails validation.
  payload_capture: false

# Management API (M3). Read-only views for the dashboard: tasks, task
# detail, agent graph, costs and settings.
management:
  enabled: true
  # Bearer token the API requires ("Authorization: Bearer <token>"). Empty
  # means the API is open, which validation only allows on a loopback
  # listener.
  auth_token: ""
  storage:
    # memory: bounded in-process ring of recent spans (no dependencies).
    # clickhouse: the store the OTel collector writes to.
    driver: memory
    memory_capacity: 4096
    clickhouse:
      url: ""
      database: otel
      username: default
      password: ""
      timeout: 10s

# Price table (CO-2). The key matches the model an agent reports
# (gen_ai.request.model). An agent that reports no model has no computable
# cost, which the dashboard shows as unknown rather than as zero.
pricing:
  - model: "demo-echo"
    input_per_1k_usd: 0.001
    output_per_1k_usd: 0.002

agents:
  # `name` and at least one upstream are required. Aliases are extra
  # (case-insensitive) lookup keys for routing. `path` may override the
  # default `{route_prefix}/{name}` listen path.
  - name: echo
    aliases: [greeter]
    upstreams:
      - url: http://127.0.0.1:9010
        # Optional binding hint used to pick the upstream that best matches
        # an incoming request (JSONRPC | HTTP+JSON | ...). Agents may declare
        # several upstreams; matching ones win, otherwise the first is used.
        binding: JSONRPC

  - name: upper
    upstreams:
      - url: http://127.0.0.1:9011
        binding: JSONRPC

# Agent card fetching and caching (GW-4). Cards are fetched once per TTL,
# revalidated with ETags, and briefly served stale on upstream errors so a
# card outage does not take the route down.
card_cache:
  ttl: 60s
  stale_grace: 10m

limits:
  # Maximum in-flight server-sent-event responses per gateway process.
  max_concurrent_streams: 1024
  # Hard cap on proxied request bodies (Content-Length above this is
  # rejected with 413; bodies without Content-Length are capped while
  # streaming). This bounds memory regardless of client behavior.
  max_request_body_bytes: 67108864 # 64 MiB
  # Deadline for draining in-flight connections on shutdown.
  shutdown_grace: 30s
  timeouts:
    # TCP connect timeout for upstream agents.
    connect: 5s
    # Maximum wait for the first response byte from an upstream agent.
    response_header: 30s
    # Total request deadline, including streams. 0 = no deadline (long
    # running A2A tasks rely on response_header + client cancellation).
    request: 0s

# M5: caller authentication, card trust, and policy modes. These defaults are
# intentionally demo-friendly; configure production credentials and keys.
callers:
  mode: off # off | optional | required
trust:
  mode: off # off | warn | enforce
policy:
  mode: off # off | warn | enforce
  default: allow
  audit_capacity: 1024

# M6: ordered same-binding upstreams fail over on transient failures. Retries
# are limited to safe methods or POSTs carrying an Idempotency-Key; the
# upstream must honor that key. Large and streaming request bodies are not
# replayed.
failure_handling:
  max_attempts: 2
  retry_budget:
    max_retries: 10
    window: 1m
  circuit_breaker:
    failure_threshold: 5
    open_duration: 30s
  max_retry_body_bytes: 65536
