# Kyurem gateway configuration for deploy/compose/docker-compose.yml.
#
# The compose stack supplies the same file at /etc/kyurem/config.yaml and
# starts demo agents under their service DNS names. Validate it with:
#   kyurem validate --config config/kyurem.compose.yaml

listeners:
  a2a:
    # Card rewriting follows the request Host header. Host clients use
    # http://localhost:8080 and agents inside the compose network use
    # http://gateway:8080; both then receive cards that point back to the
    # same reachable gateway address.
    addr: "0.0.0.0:8080"
    public_base_url: ""
    route_prefix: "/a2a"
  admin:
    addr: "0.0.0.0:8081"

  # The management API (M3) the dashboard reads. It is a separate listener:
  # the A2A data path stays transparent.
  mgmt:
    addr: "0.0.0.0:8082"

logging:
  level: info
  format: json

telemetry:
  service_name: kyurem-gateway
  otlp_endpoint: "http://otel-collector:4318"
  otlp_protocol: http/protobuf
  otlp_insecure: true
  sample_ratio: 1
  queue_size: 2048
  batch_size: 512
  batch_timeout: 5s
  export_timeout: 10s
  max_retries: 4
  initial_backoff: 500ms
  max_backoff: 10s
  payload_capture: false

# Management API (M3). The dashboard reads the same spans the collector
# writes to ClickHouse.
management:
  enabled: true
  # Demo token. The compose stack overrides it through
  # KYUREM_MANAGEMENT_AUTH_TOKEN; never reuse it outside a demo.
  auth_token: "kyurem-demo"
  storage:
    driver: clickhouse
    memory_capacity: 4096
    clickhouse:
      url: "http://clickhouse:8123"
      database: otel
      username: default
      # Overridden by KYUREM_MANAGEMENT_STORAGE_CLICKHOUSE_PASSWORD.
      password: "kyurem-demo"
      timeout: 10s

# Price table (CO-2) for the demo agents.
pricing:
  - model: "demo-echo"
    input_per_1k_usd: 0.001
    output_per_1k_usd: 0.002

agents:
  - name: echo
    aliases: [greeter]
    upstreams:
      - url: http://go-echo:9010
        binding: JSONRPC

  - name: upper
    upstreams:
      - url: http://go-upper:9011
        binding: JSONRPC
  - name: python-echo
    tags: [python, demo]
    upstreams:
      - url: http://python-echo:9012
        binding: JSONRPC
  - name: python-upper
    tags: [python, demo]
    upstreams:
      - url: http://python-upper:9013
        binding: JSONRPC
  - name: failover-demo
    tags: [python, failure-demo]
    upstreams:
      - url: http://python-flaky:9014
        binding: JSONRPC
      - url: http://python-echo:9012
        binding: JSONRPC

card_cache:
  ttl: 60s
  stale_grace: 10m

limits:
  max_concurrent_streams: 1024
  max_request_body_bytes: 67108864
  shutdown_grace: 30s
  timeouts:
    connect: 5s
    response_header: 30s
    request: 0s

# Safe retries require an idempotent method or a caller-provided
# Idempotency-Key on a bounded-size POST body.
failure_handling:
  max_attempts: 2
  retry_budget:
    max_retries: 10
    window: 1m
  circuit_breaker:
    failure_threshold: 5
    open_duration: 30s
  max_retry_body_bytes: 65536
