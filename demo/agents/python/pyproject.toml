[project]
name = "kyurem-demo-agents"
version = "0.1.0"
description = "Small A2A Python agents used by Kyurem demos and conformance checks"
requires-python = ">=3.11,<3.15"
dependencies = ["a2a-sdk[http-server]==1.2.3", "uvicorn==0.38.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
