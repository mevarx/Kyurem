<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Kyurem gateway architecture</title>
  <desc id="desc">A2A clients route through the Kyurem gateway to Go and Python agents. The gateway sends traces to the OpenTelemetry collector and serves health metrics and the management API. The dashboard reads the management API, while the collector exports to ClickHouse.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52749b"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b45}.box{fill:#f7faff;stroke:#9eb5cf;stroke-width:2;rx:16}.core{fill:#e5efff;stroke:#3974c6;stroke-width:3;rx:20}.telemetry{fill:#f1fbf7;stroke:#58a58b;stroke-width:2;rx:16}.line{fill:none;stroke:#52749b;stroke-width:3;marker-end:url(#arrow)}.label{font-size:15px;fill:#4a6280}.title{font-size:22px;font-weight:700}.small{font-size:16px}
    </style>
  </defs>
  <rect width="1100" height="460" rx="20" fill="#fff"/>
  <rect class="box" x="35" y="70" width="200" height="105"/>
  <text class="title" x="135" y="112" text-anchor="middle">A2A clients</text>
  <text class="small" x="135" y="143" text-anchor="middle">JSON-RPC · HTTP+JSON · SSE</text>
  <rect class="core" x="325" y="50" width="340" height="155"/>
  <text class="title" x="495" y="91" text-anchor="middle">Kyurem gateway</text>
  <text class="small" x="495" y="122" text-anchor="middle">Proxy · policy · trust</text>
  <text class="small" x="495" y="151" text-anchor="middle">Retries · circuit breakers · failover</text>
  <text class="small" x="495" y="180" text-anchor="middle">OpenTelemetry handoff spans</text>
  <rect class="box" x="790" y="45" width="255" height="78"/>
  <text class="title" x="917" y="79" text-anchor="middle">Go agents</text>
  <text class="small" x="917" y="104" text-anchor="middle">echo · upper</text>
  <rect class="box" x="790" y="145" width="255" height="78"/>
  <text class="title" x="917" y="179" text-anchor="middle">Python agents</text>
  <text class="small" x="917" y="204" text-anchor="middle">echo · upper · flaky</text>
  <path class="line" d="M235 122H315"/><path class="line" d="M665 105H780"/><path class="line" d="M665 160H780"/>
  <text class="label" x="275" y="108" text-anchor="middle">A2A</text>
  <rect class="telemetry" x="325" y="285" width="250" height="105"/>
  <text class="title" x="450" y="327" text-anchor="middle">OTel Collector</text>
  <text class="small" x="450" y="357" text-anchor="middle">bounded async export</text>
  <rect class="telemetry" x="650" y="285" width="210" height="105"/>
  <text class="title" x="755" y="327" text-anchor="middle">ClickHouse</text>
  <text class="small" x="755" y="357" text-anchor="middle">trace storage</text>
  <path class="line" d="M495 205V275"/><path class="line" d="M575 337H640"/>
  <text class="label" x="536" y="250">OTLP</text>
  <rect class="box" x="35" y="285" width="245" height="105"/>
  <text class="title" x="157" y="327" text-anchor="middle">Management API</text>
  <text class="small" x="157" y="357" text-anchor="middle">tasks · agents · policy · costs</text>
  <rect class="box" x="905" y="285" width="155" height="105"/>
  <text class="title" x="982" y="327" text-anchor="middle">Dashboard</text>
  <text class="small" x="982" y="357" text-anchor="middle">diagnosis &amp; traces</text>
  <path class="line" d="M405 205 255 275"/><path class="line" d="M280 337H895"/>
  <text class="label" x="325" y="247">read API</text>
</svg>
