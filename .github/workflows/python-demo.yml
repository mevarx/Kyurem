name: Python Demo Agents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --project demo/agents/python --frozen
          npm ci --prefix dashboard
      - name: Test Python agents
        run: uv run --project demo/agents/python --frozen python -m unittest discover -s demo/agents/python/tests -v
      - name: Verify dashboard failure/failover walkthrough
        run: KYUREM_DEMO_KEEP_RUNNING=0 bash demo/scenarios/m6-failover.sh
