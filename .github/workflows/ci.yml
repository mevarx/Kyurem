name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build
        run: go build ./...
        working-directory: gateway
      - name: Vet
        run: go vet ./...
        working-directory: gateway
      - name: Test (race)
        run: go test -race ./...
        working-directory: gateway

  dashboard:
    name: Dashboard (ts)
    runs-on: ubuntu-latest
    # The dashboard lands in M3 (see docs/milestones.md); this job is a placeholder
    # so the workflow shape is stable from the start.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: hashFiles('dashboard/package.json') != ''
        run: npm ci && npm run typecheck && npm test
        working-directory: dashboard
