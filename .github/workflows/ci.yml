name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The modules live in subdirectories; without this the cache step
          # looks for a go.sum in the repository root and fails.
          cache-dependency-path: |
            gateway/go.sum
            demo/go.sum
      - name: Build
        run: |
          go build ./...
          # Build the entrypoint explicitly: `go build ./...` silently skips
          # a missing package directory, which once hid the missing
          # gateway/cmd/kyurem from the whole pipeline.
          go build -o "$RUNNER_TEMP/kyurem" ./cmd/kyurem
        working-directory: gateway
      - name: Vet
        run: go vet ./...
        working-directory: gateway
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
        working-directory: gateway
      - name: Test (race)
        run: go test -race ./...
        working-directory: gateway
      - name: Validate shipped configs
        run: |
          go run ./cmd/kyurem validate --config ../config/kyurem.example.yaml
          go run ./cmd/kyurem validate --config ../config/kyurem.compose.yaml
          go run ./cmd/kyurem validate --config ../config/kyurem.conformance.yaml
        working-directory: gateway
      - name: M3 demo (a scripted failure is diagnosable)
        # The M3 exit criterion, executed: a failing task shows up in the
        # management API with a root-cause hint.
        shell: pwsh
        run: ./demo/scenarios/m3-dashboard.ps1

  demo:
    name: Demo agents (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            gateway/go.sum
            demo/go.sum
      - name: Build
        run: |
          go build ./...
          go build -o "$RUNNER_TEMP/go-echo" ./agents/go-echo
          go build -o "$RUNNER_TEMP/go-upper" ./agents/go-upper
          go build -o "$RUNNER_TEMP/demo-client" ./scenarios/client
        working-directory: demo
      - name: Vet
        run: go vet ./...
        working-directory: demo
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
        working-directory: demo
      - name: Test (race)
        run: go test -race ./...
        working-directory: demo

  compose:
    name: Compose stack (config only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The M2 compose stack is a local demo; CI checks that the file stays
      # valid Compose configuration. Running the stack (collector ->
      # ClickHouse -> Grafana) needs Docker images and is a manual step:
      # `make demo-m2`.
      - name: Validate compose file
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet

