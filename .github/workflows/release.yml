name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - platform: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - platform: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - platform: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - platform: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: gateway/go.sum
      - name: Build and package gateway
        shell: bash
        working-directory: gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          binary="kyurem-${VERSION}-${{ matrix.platform }}${{ matrix.ext }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/kyurem-project/kyurem/gateway/internal/version.Version=${VERSION}" \
            -o "../dist/${binary}" ./cmd/kyurem
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd ../dist && zip -q "kyurem-${VERSION}-${{ matrix.platform }}.zip" "${binary}")
          else
            (cd ../dist && tar -czf "kyurem-${VERSION}-${{ matrix.platform }}.tar.gz" "${binary}")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 3

  images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kyurem-gateway
            file: deploy/docker/gateway.Dockerfile
          - name: kyurem-dashboard
            file: deploy/docker/dashboard.Dockerfile
          - name: kyurem-demo
            file: deploy/docker/demo.Dockerfile
          - name: kyurem-python-demo
            file: deploy/docker/python-demo.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KYUREM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish GitHub release
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Kyurem ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release/*
