name: Dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    name: Dashboard (ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate API types
        # The dashboard types come from api/openapi.yaml, never by hand.
        run: npm run gen:api
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
