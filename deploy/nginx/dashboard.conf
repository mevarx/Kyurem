# Nginx configuration for the Kyurem dashboard image.
#
# The dashboard is a static single-page app; the management API lives on the
# gateway's own listener. Proxying /api here keeps the browser on one
# origin, so no CORS configuration and no API base URL in the build.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Management API: the gateway's management listener.
    location /api/ {
        proxy_pass http://gateway:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header (bearer token) is forwarded as-is.
        proxy_read_timeout 60s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
